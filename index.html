<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Neobuster</title>
    <!-- installable as an app (PWA): full screen in landscape, offline (js/core/pwa.js, sw.js) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#05061a" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Neobuster" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <!-- load order matters: every file shares one global scope and builds on the ones before it -->
    <!-- core: canvas, input, sound, music, text -->
    <script src="js/core/engine.js"></script>
    <!-- core: the cloud save (before the cheat box, so typing a password never opens it) -->
    <script src="js/core/cloud.js"></script>
    <!-- core: the game as an installable app (PWA) -->
    <script src="js/core/pwa.js"></script>
    <!-- core: the touch buttons on phones and tablets -->
    <script src="js/core/touch.js"></script>
    <!-- core: menu widgets shared by every screen (key hints, buttons, panels) -->
    <script src="js/core/ui.js"></script>
    <!-- art: palettes, tilesets, backgrounds, icons -->
    <script src="js/art/art.js"></script>
    <!-- characters: the native character system, the hero and the bosses of each continent -->
    <script src="js/characters/chars.js"></script>
    <script src="js/characters/nexo.js"></script>
    <script src="js/characters/azura/sniptor.js"></script>
    <script src="js/characters/azura/magmaron.js"></script>
    <script src="js/characters/azura/voltrax.js"></script>
    <script src="js/characters/azura/glacielle.js"></script>
    <script src="js/characters/azura/terralyn.js"></script>
    <script src="js/characters/azura/winderwomen.js"></script>
    <script src="js/characters/vespera/hydros.js"></script>
    <script src="js/characters/vespera/toxaris.js"></script>
    <script src="js/characters/vespera/umbrion.js"></script>
    <script src="js/characters/vespera/sonique.js"></script>
    <script src="js/characters/vespera/lumina.js"></script>
    <script src="js/characters/vespera/chronia.js"></script>
    <script src="js/characters/noctara/gravion.js"></script>
    <script src="js/characters/noctara/polaris.js"></script>
    <script src="js/characters/noctara/astraea.js"></script>
    <!-- stages: the continents, stage data and the Azura layouts -->
    <script src="js/stages/levels.js"></script>
    <!-- gameplay: the player, weapons, enemies, bosses, hazards, pickups; the cheat box -->
    <script src="js/gameplay/actors.js"></script>
    <script src="js/gameplay/cheats.js"></script>
    <!-- continents: everything a continent adds (stages, bosses, weapons, enemies, art, music) -->
    <script src="js/continents/vespera.js"></script>
    <script src="js/continents/noctara.js"></script>
    <!-- world: the world map's islands, the Training Ground and the Boss Arena -->
    <script src="js/world/worldmap.js"></script>
    <script src="js/world/training.js"></script>
    <script src="js/world/arena.js"></script>
    <!-- core: the game's flow, screens, shop, save and main loop (last: it uses everything above) -->
    <script src="js/core/main.js"></script>
  </body>
</html>
